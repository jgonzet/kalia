services:
  app:
    build: .
    ports:
      - "8000:8000"
    env_file:
      - path: .env
        required: false
      # API keys: passed to the container as environment variables at startup, never copied into the image.
      - path: .env.secrets
        required: false
    environment:
      # The SQLite file lives inside the container (no volume): `docker compose down` deletes it, and the next `up` loads the sample again.
      DB_PATH: /var/lib/kalia/kalia.db
    extra_hosts:
      # Lets the container reach Ollama running on the host as host.docker.internal.
      - "host.docker.internal:host-gateway"
