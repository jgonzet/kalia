services:
  app:
    build: .
    ports:
      - "8000:8000"
    env_file:
      - path: .env
        required: false
    extra_hosts:
      # Lets the container reach Ollama running on the host as host.docker.internal.
      - "host.docker.internal:host-gateway"
    volumes:
      - kalia-db:/db

volumes:
  kalia-db:
