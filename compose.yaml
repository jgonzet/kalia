services:
  app:
    build: .
    ports:
      - "8000:8000"
    env_file:
      - path: .env
        required: false
    environment:
      # Storage settings live here, not in the Dockerfile, so changing the database touches only this file.
      DB_PATH: /var/lib/kalia/kalia.db
    extra_hosts:
      # Lets the container reach Ollama running on the host as host.docker.internal.
      - "host.docker.internal:host-gateway"
    volumes:
      - kalia-db:/var/lib/kalia

volumes:
  kalia-db:
