name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
      - run: uv sync
      - run: uv run pytest
      - run: uv run scripts/dataset/check_dataset.py
      - run: uv run scripts/check_chat_judge.py
      - run: uv run scripts/evaluate_retrieval.py lamanija --strict --no-log
      - run: uv run scripts/smoke_test.py
      - run: uv run scripts/smoke_test_docker.py
